[build-system]
requires = [
  "scikit-build-core>=0.11",
  "numpy>=1.26,<2.5.1",
  "meson>=1.3",
  "meson-python>=0.15",
  "ninja"
]
build-backend = "scikit_build_core.build"

[project]
name            = "Terpdose"
version         = "1.1.0"
description     = "Terpdose post-processes HDF5 data files generated by Lionbolt and NittanyPhysics."
readme          = "README.md"
requires-python = ">=3.10"
authors         = [
  { name = "Muhsin H. Younis", email = "myounis@psu.edu" }
  ]
dependencies    = [
  "numpy>=1.26",
  "h5py>=3.16.0",
  "matplotlib>=3.10.8"
  ]

[project.scripts]
"plot_deposition.py" = "Terpdose.scripts.plot_deposition:main"
"plot_fluence.py"    = "Terpdose.scripts.plot_fluence:main"
"plot_spectra.py"    = "Terpdose.scripts.plot_spectra:main"
"plot_current.py"    = "Terpdose.scripts.plot_current:main"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-musllinux*"
